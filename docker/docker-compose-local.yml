services:
  # ========================
  # MySQL
  # ========================
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: localmysql
      MYSQL_USER: localuser
      MYSQL_PASSWORD: localpass
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
      - ./create-debezium-user.sql:/docker-entrypoint-initdb.d/create-debezium-user.sql

  # ========================
  # Liquibase - MySQL Migration
  # ========================
  liquibase-mysql:
    build:
      context: .
      dockerfile: liquibase-mysql.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../lbase/mysql:/liquibase/changelog
    command:
      - --url=jdbc:mysql://mysql:3306/localmysql
      - --username=localuser
      - --password=localpass
      - --driver=com.mysql.cj.jdbc.Driver
      - --changeLogFile=db.changelog-master.xml
      - update

  # ========================
  # Kafka
  # ========================
  kafka:
    image: confluentinc/cp-kafka:8.2.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "ciWo7IWazngRchmPES6q5A=="
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:19093"
      KAFKA_LISTENERS: "INTERNAL://kafka:19092,CONTROLLER://kafka:19093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # We run Kafka Streams (see ChatKafkaStreamsConfig, TrialKafkaStreamsConfig) against the CDC
      # topics, and Streams treats a missing source topic on startup as fatal (no retry - see
      # KafkaTopicConfig / *KafkaTopicConfig). Topics must exist before anyone produces or
      # consumes, so both the broker and Kafka Connect (below) are told not to create them
      # implicitly; every topic is declared as a NewTopic bean instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:19092"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ========================
  # Kafka Connect
  # ========================
  kafka-connect:
    image: quay.io/debezium/connect:3.4.3.Final
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      liquibase-mysql:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      # See the comment on KAFKA_AUTO_CREATE_TOPICS_ENABLE above - CDC topics are provisioned
      # ahead of time via NewTopic beans, not created lazily when a connector first produces to
      # them.
      CONNECT_TOPIC_CREATION_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ========================
  # MySQL Connector Bootstrap
  # ========================
  mysql-connector-bootstrap:
    image: curlimages/curl:8.5.0
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./mysql-connector-config.json:/mysql-connector-config.json
    entrypoint:
      - sh
      - -c
      - |
        echo "registering...."

        curl -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d @/mysql-connector-config.json

        echo "done"

  # ========================
  # Kafka UI
  # ========================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8084:8080"
    depends_on:
      - kafka
      - kafka-connect
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  # ========================
  # Redis
  # ========================
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ========================
  # Redis Insight
  # ========================
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  mysql-data:
  kafka-data:
  redis-data:

