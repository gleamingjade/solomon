plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.github.f4b6a3:uuid-creator:6.1.0'
	
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-data-cassandra'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation("org.flywaydb:flyway-core:11.20.0") 
	implementation("org.flywaydb:flyway-mysql:11.20.0")
	implementation("com.mysql:mysql-connector-j:8.0.32")

	implementation("org.springframework.kafka:spring-kafka:3.3.16")
	implementation("org.apache.kafka:kafka-streams")

	compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation "org.testcontainers:testcontainers-mysql:2.0.5"
	testImplementation "org.testcontainers:testcontainers-scylladb:2.0.5"
	testImplementation "org.testcontainers:testcontainers-kafka:2.0.5"
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

	testImplementation 'org.instancio:instancio-junit:6.0.0-RC2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
